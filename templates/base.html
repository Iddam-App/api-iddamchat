{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="IddamChat — Comunidad para miembros de la Iglesia de Dios, Una Asociacion Mundial">
    <title>{% block title %}IddamChat{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/iddamchat.css' %}" rel="stylesheet">
    <script>
    // Immediately apply theme + decide which nav to show (prevents flash)
    (function() {
        var theme = localStorage.getItem('iddam_theme') || 'light';
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        var logged = !!localStorage.getItem('access_token');
        // Inject a style tag that hides the wrong nav instantly
        var s = document.createElement('style');
        s.textContent = logged
            ? '#nav-guest{display:none!important}#site-footer{display:none!important}'
            : '#nav-user{display:none!important}#bottom-nav{display:none!important}';
        document.head.appendChild(s);
        window.__iddamLogged = logged;
    })();
    </script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-iddam sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="{% static 'img/logo_brown.png' %}" alt="COGWA">
            </a>
            <!-- Guest nav -->
            <div class="d-flex align-items-center gap-2" id="nav-guest">
                <a class="nav-link" href="/login/" style="font-weight:500; color:var(--text-secondary);">Iniciar Sesion</a>
                <a class="btn btn-gold btn-sm text-white px-3" href="/register/">Registrarse</a>
                <button class="theme-toggle" id="theme-toggle-guest" title="Cambiar tema">
                    <i class="bi bi-moon-fill"></i>
                </button>
            </div>
            <!-- Logged-in nav (minimal: just icons) -->
            <div class="d-flex align-items-center gap-2" id="nav-user" style="display:none !important;">
                <a href="/chat/" class="nav-icon-btn" id="nav-chat-btn" title="Mensajes">
                    <i class="bi bi-send"></i>
                    <span class="nav-badge" id="nav-unread-badge" style="display:none;">0</span>
                </a>
                <a href="/notifications/" class="nav-icon-btn" id="nav-notif-btn" title="Notificaciones">
                    <i class="bi bi-bell"></i>
                    <span class="nav-badge" id="nav-notif-badge" style="display:none;">0</span>
                </a>
                <button class="theme-toggle" id="theme-toggle-user" title="Cambiar tema">
                    <i class="bi bi-moon-fill"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer (hidden when logged in) -->
    <footer class="footer-iddam" id="site-footer">
        <div class="container">
            <img src="{% static 'img/logo_white.png' %}" alt="COGWA"><br>
            <span>&copy; 2026 Iglesia de Dios, Una Asociacion Mundial &mdash; IddamChat</span>
        </div>
    </footer>

    <!-- Bottom Navigation (logged-in only) -->
    <nav class="bottom-nav" id="bottom-nav" style="display:none;">
        <a href="/feed/" class="nav-tab" data-page="feed">
            <i class="bi bi-house-door"></i>
            <span>Inicio</span>
        </a>
        <a href="/hobbies/" class="nav-tab" data-page="hobbies">
            <i class="bi bi-compass"></i>
            <span>Explorar</span>
        </a>
        <button class="nav-tab create-tab" data-bs-toggle="modal" data-bs-target="#createPostModal">
            <i class="bi bi-plus-square"></i>
            <span>Crear</span>
        </button>
        <a href="/chat/" class="nav-tab" data-page="chat">
            <i class="bi bi-chat-dots"></i>
            <span>Chat</span>
            <span class="nav-badge bottom-unread-badge" style="display:none;">0</span>
        </a>
        <a href="/groups/" class="nav-tab" data-page="groups">
            <i class="bi bi-people"></i>
            <span>Grupos</span>
        </a>
        <a href="/profile/" class="nav-tab" data-page="profile">
            <i class="bi bi-person-circle"></i>
            <span>Perfil</span>
        </a>
    </nav>

    <!-- Global Create Post Modal -->
    <div class="modal fade" id="createPostModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Nueva Publicacion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Visibility selector -->
                    <div class="visibility-selector mb-3" id="visibility-selector">
                        <button type="button" class="vis-btn active" data-vis="public" onclick="selectVisibility('public')">
                            <i class="bi bi-globe2"></i> Todos
                        </button>
                        <button type="button" class="vis-btn" data-vis="friends" onclick="selectVisibility('friends')">
                            <i class="bi bi-people-fill"></i> Amigos
                        </button>
                        <button type="button" class="vis-btn" data-vis="group" onclick="selectVisibility('group')">
                            <i class="bi bi-collection"></i> Grupo
                        </button>
                    </div>

                    <!-- Group selector (hidden by default) -->
                    <div id="group-selector-wrapper" style="display:none;" class="mb-3">
                        <select class="form-select form-select-sm" id="post-group-id" style="border-radius:10px;">
                            <option value="">Selecciona un grupo...</option>
                        </select>
                    </div>

                    <input type="text" class="form-control mb-3" id="post-title" placeholder="Titulo (opcional)" style="border-radius:10px;">
                    <textarea id="post-content" placeholder="Que quieres compartir?"></textarea>
                    <div class="image-preview-container" id="image-previews"></div>
                </div>
                <div class="upload-progress" id="post-upload-progress">
                    <div class="upload-progress-track"><div class="upload-progress-fill"></div></div>
                    <div class="upload-progress-text">0%</div>
                </div>
                <div class="modal-footer justify-content-between">
                    <div class="d-flex gap-2">
                        <label class="btn btn-outline-secondary btn-sm" style="border-radius:8px; cursor:pointer;">
                            <i class="bi bi-image me-1"></i>Foto
                            <input type="file" id="post-images" multiple accept="image/*" style="display:none;">
                        </label>
                        <select class="form-select form-select-sm" id="post-type" style="border-radius:8px; width:auto;">
                            <option value="general">General</option>
                            <option value="hobby">Hobby</option>
                        </select>
                    </div>
                    <button class="btn btn-gradient btn-sm px-4" id="btn-publish" style="border-radius:8px;">
                        Publicar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/iddamchat.js' %}"></script>
    <script>
    // ─── Theme Toggle ───
    (function() {
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            document.querySelectorAll('.theme-toggle i').forEach(function(icon) {
                icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
            });
            localStorage.setItem('iddam_theme', theme);
        }

        function toggleTheme() {
            var current = localStorage.getItem('iddam_theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        var saved = localStorage.getItem('iddam_theme') || 'light';
        applyTheme(saved);

        document.querySelectorAll('.theme-toggle').forEach(function(btn) {
            btn.addEventListener('click', toggleTheme);
        });
    })();

    // ─── Nav & Bottom Nav Setup ───
    (function initNav() {
        if (!isLoggedIn()) return;

        // Show logged-in UI
        document.getElementById('nav-guest').style.display = 'none';
        const navUser = document.getElementById('nav-user');
        navUser.style.cssText = 'display:flex !important;';
        document.getElementById('bottom-nav').style.display = 'flex';
        document.body.classList.add('has-bottom-nav');
        document.getElementById('site-footer').style.display = 'none';

        // Highlight active tab
        const path = window.location.pathname;
        document.querySelectorAll('.bottom-nav .nav-tab[data-page]').forEach(tab => {
            const page = tab.dataset.page;
            if (page === 'feed' && (path === '/feed/' || path === '/')) tab.classList.add('active');
            else if (page === 'hobbies' && path.startsWith('/hobbies')) tab.classList.add('active');
            else if (page === 'chat' && path.startsWith('/chat')) tab.classList.add('active');
            else if (page === 'groups' && path.startsWith('/groups')) tab.classList.add('active');
            else if (page === 'profile' && path.startsWith('/profile')) tab.classList.add('active');
        });

        // Highlight top nav icons
        if (path.startsWith('/chat')) {
            document.getElementById('nav-chat-btn').classList.add('active');
        }
        if (path.startsWith('/notifications')) {
            const nb = document.getElementById('nav-notif-btn');
            if (nb) nb.classList.add('active');
        }

        // Load unread count + notification count + user data in parallel (non-blocking)
        loadUnreadCount();
        loadNotifCount();
        ensureUserData();

        // Setup global create post
        setupGlobalCreatePost();
    })();

    // ─── User Data (lazy, non-blocking) ───
    async function ensureUserData() {
        if (localStorage.getItem('user_data')) return;
        try {
            const res = await authFetch('/api/auth/me/');
            if (res.ok) {
                const u = await res.json();
                localStorage.setItem('user_data', JSON.stringify(u));
            }
        } catch(e) {}
    }

    // ─── Unread Messages Badge ───
    async function loadUnreadCount() {
        try {
            const res = await authFetch('/api/chat/unread/');
            if (!res.ok) return;
            const data = await res.json();
            const count = data.unread_count || 0;

            // Top navbar badge
            const badge = document.getElementById('nav-unread-badge');
            if (count > 0) {
                badge.textContent = count > 99 ? '99+' : count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }

            // Bottom nav badge
            document.querySelectorAll('.bottom-unread-badge').forEach(b => {
                if (count > 0) {
                    b.textContent = count > 99 ? '99+' : count;
                    b.style.display = 'flex';
                } else {
                    b.style.display = 'none';
                }
            });
        } catch(e) {}
    }
    if (isLoggedIn()) setInterval(loadUnreadCount, 15000);

    // ─── Notification Badge ───
    async function loadNotifCount() {
        try {
            const res = await authFetch('/api/notifications/unread-count/');
            if (!res.ok) return;
            const data = await res.json();
            const count = data.unread_count || data.count || 0;
            const badge = document.getElementById('nav-notif-badge');
            if (badge) {
                if (count > 0) {
                    badge.textContent = count > 99 ? '99+' : count;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }
        } catch(e) {}
    }
    if (isLoggedIn()) setInterval(loadNotifCount, 20000);

    // ─── Visibility Selector ───
    let selectedVisibility = 'public';
    let userGroups = null; // cache

    function selectVisibility(vis) {
        selectedVisibility = vis;
        document.querySelectorAll('.vis-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.vis-btn[data-vis="${vis}"]`).classList.add('active');

        const groupWrapper = document.getElementById('group-selector-wrapper');
        if (vis === 'group') {
            groupWrapper.style.display = 'block';
            loadUserGroups();
        } else {
            groupWrapper.style.display = 'none';
        }
    }

    async function loadUserGroups() {
        if (userGroups) return; // already loaded
        try {
            const res = await authFetch('/api/groups/');
            if (!res.ok) return;
            const data = await res.json();
            const groups = data.results || data;
            userGroups = groups.filter(g => g.is_member);
            const sel = document.getElementById('post-group-id');
            sel.innerHTML = '<option value="">Selecciona un grupo...</option>';
            userGroups.forEach(g => {
                sel.insertAdjacentHTML('beforeend',
                    `<option value="${g.id}">${escapeHtml(g.name)}</option>`
                );
            });
        } catch(e) {}
    }

    // ─── Global Create Post ───
    let selectedImages = [];

    function setupGlobalCreatePost() {
        const input = document.getElementById('post-images');
        if (!input) return;
        input.addEventListener('change', () => {
            const container = document.getElementById('image-previews');
            for (const file of input.files) {
                if (selectedImages.length >= 4) break;
                selectedImages.push(file);
                const reader = new FileReader();
                reader.onload = (e) => {
                    const idx = selectedImages.indexOf(file);
                    container.insertAdjacentHTML('beforeend', `
                        <div class="preview-thumb" data-idx="${idx}">
                            <img src="${e.target.result}" alt="">
                            <button class="remove-btn" onclick="removeImage(${idx}, this)">&times;</button>
                        </div>
                    `);
                };
                reader.readAsDataURL(file);
            }
            input.value = '';
        });

        document.getElementById('btn-publish').addEventListener('click', publishPost);
    }

    function removeImage(idx, btn) {
        selectedImages[idx] = null;
        btn.closest('.preview-thumb').remove();
    }

    async function publishPost() {
        const title = document.getElementById('post-title').value.trim();
        const content = document.getElementById('post-content').value.trim();
        const postType = document.getElementById('post-type').value;

        if (!content) {
            showToast('Escribe algo para publicar');
            return;
        }

        // If posting to group, use group post endpoint
        if (selectedVisibility === 'group') {
            const groupId = document.getElementById('post-group-id').value;
            if (!groupId) {
                showToast('Selecciona un grupo');
                return;
            }
            await publishGroupPost(groupId, content, title);
            return;
        }

        const btn = document.getElementById('btn-publish');
        btn.disabled = true;

        const formData = new FormData();
        formData.append('post_type', postType);
        formData.append('visibility', selectedVisibility);
        if (title) formData.append('title', title);
        formData.append('content', content);

        const hasImages = selectedImages.filter(Boolean).length > 0;
        selectedImages.filter(Boolean).forEach(file => {
            formData.append('images', file);
        });

        try {
            let res;
            if (hasImages) {
                btn.textContent = 'Subiendo...';
                showUploadProgress('post-upload-progress');
                res = await uploadWithProgress('/api/posts/create/', formData, (pct) => {
                    updateUploadProgress('post-upload-progress', pct);
                });
            } else {
                btn.textContent = 'Publicando...';
                res = await authFetch('/api/posts/create/', {
                    method: 'POST',
                    body: formData,
                });
            }

            hideUploadProgress('post-upload-progress');

            if (res.ok) {
                resetPostModal();
                showToast('Publicacion creada!');
                reloadCurrentFeed();
            } else {
                const data = await Promise.resolve(res.json());
                showToast(data.detail || 'Error al publicar');
            }
        } catch(e) {
            hideUploadProgress('post-upload-progress');
            showToast('Error de conexion');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Publicar';
        }
    }

    async function publishGroupPost(groupId, content, title) {
        const btn = document.getElementById('btn-publish');
        btn.disabled = true;
        btn.textContent = 'Publicando...';

        const formData = new FormData();
        formData.append('content', content);

        const hasImages = selectedImages.filter(Boolean).length > 0;
        if (hasImages) {
            // Group posts support single image
            const firstImage = selectedImages.find(Boolean);
            if (firstImage) formData.append('image', firstImage);
        }

        try {
            let res;
            if (hasImages) {
                showUploadProgress('post-upload-progress');
                res = await uploadWithProgress(`/api/groups/${groupId}/posts/`, formData, (pct) => {
                    updateUploadProgress('post-upload-progress', pct);
                });
            } else {
                res = await authFetch(`/api/groups/${groupId}/posts/`, {
                    method: 'POST',
                    body: formData,
                });
            }

            hideUploadProgress('post-upload-progress');

            if (res.ok) {
                resetPostModal();
                showToast('Publicado en el grupo!');
                reloadCurrentFeed();
            } else {
                const data = await Promise.resolve(res.json());
                showToast(data.detail || 'Error al publicar');
            }
        } catch(e) {
            hideUploadProgress('post-upload-progress');
            showToast('Error de conexion');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Publicar';
        }
    }

    function resetPostModal() {
        bootstrap.Modal.getInstance(document.getElementById('createPostModal')).hide();
        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        document.getElementById('image-previews').innerHTML = '';
        document.getElementById('post-type').value = 'general';
        selectedImages = [];
        selectVisibility('public');
    }

    function reloadCurrentFeed() {
        if (typeof loadFeed === 'function') {
            const feedEl = document.getElementById('posts-feed');
            if (feedEl) feedEl.innerHTML = '';
            currentPage = 1;
            loadFeed();
        } else {
            window.location.reload();
        }
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
