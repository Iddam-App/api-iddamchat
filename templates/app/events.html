{% extends "base.html" %}
{% load static %}

{% block title %}Eventos — IddamChat{% endblock %}

{% block content %}
<div class="feed-container">
    <div class="feed-header">
        <h2><i class="bi bi-calendar-event me-2"></i>Eventos</h2>
        <button class="btn btn-gradient btn-sm" onclick="openCreateEventModal()">
            <i class="bi bi-plus-lg me-1"></i>Crear
        </button>
    </div>

    <!-- Tabs -->
    <div class="hosting-tabs" style="margin-bottom:1rem;">
        <button class="hosting-tab active" data-tab="upcoming" onclick="switchEventTab('upcoming')"><i class="bi bi-calendar3"></i> Proximos</button>
        <button class="hosting-tab" data-tab="my-events" onclick="switchEventTab('my-events')"><i class="bi bi-bookmark-star"></i> Mis Eventos</button>
    </div>

    <div class="feed-spinner" id="events-spinner">
        <div class="spinner-border" role="status"></div>
    </div>

    <div id="events-list"></div>

    <div class="empty-state" id="events-empty" style="display:none;">
        <i class="bi bi-calendar-x"></i>
        <h5>No hay eventos</h5>
        <p>Crea uno para empezar</p>
    </div>
</div>

<!-- Event Detail Modal -->
<div class="modal-overlay" id="event-detail-modal" style="display:none;" onclick="closeEventDetail(event)">
    <div class="event-detail-card" onclick="event.stopPropagation()">
        <button class="btn-close event-close-btn" onclick="closeEventDetail()"></button>
        <div class="event-detail-cover" id="ed-cover"></div>
        <div class="event-detail-body">
            <div class="event-detail-badges" id="ed-badges"></div>
            <h3 id="ed-title"></h3>
            <div class="event-detail-meta">
                <div class="event-meta-item">
                    <i class="bi bi-calendar3"></i>
                    <span id="ed-date"></span>
                </div>
                <div class="event-meta-item" id="ed-location-wrap">
                    <i class="bi bi-geo-alt"></i>
                    <span id="ed-location"></span>
                </div>
                <div class="event-meta-item" id="ed-link-wrap" style="display:none;">
                    <i class="bi bi-camera-video"></i>
                    <a href="#" id="ed-link" target="_blank">Unirse al evento virtual</a>
                </div>
            </div>
            <p id="ed-description" class="event-detail-desc"></p>
            <div class="event-detail-organizer" id="ed-organizer"></div>

            <div class="event-rsvp-section">
                <div class="event-attendee-count" id="ed-attendees-count"></div>
                <div class="event-rsvp-buttons" id="ed-rsvp-buttons">
                    <button class="btn btn-sm rsvp-btn" data-rsvp="going" onclick="rsvpEvent('going')">
                        <i class="bi bi-check-circle me-1"></i>Asistire
                    </button>
                    <button class="btn btn-sm rsvp-btn" data-rsvp="maybe" onclick="rsvpEvent('maybe')">
                        <i class="bi bi-question-circle me-1"></i>Tal vez
                    </button>
                    <button class="btn btn-sm rsvp-btn" data-rsvp="not_going" onclick="rsvpEvent('not_going')">
                        <i class="bi bi-x-circle me-1"></i>No
                    </button>
                </div>
            </div>

            <!-- Attendees List -->
            <div id="ed-attendees-list" class="event-attendees-list"></div>
        </div>
    </div>
</div>

<!-- Create Event Modal -->
<div class="modal fade" id="createEventModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-calendar-plus me-2"></i>Crear Evento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Titulo</label>
                    <input type="text" class="form-control" id="ce-title" placeholder="Nombre del evento" maxlength="200">
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripcion</label>
                    <textarea class="form-control" id="ce-description" rows="3" placeholder="Detalles del evento..."></textarea>
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">Fecha inicio</label>
                        <input type="datetime-local" class="form-control" id="ce-start">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Fecha fin</label>
                        <input type="datetime-local" class="form-control" id="ce-end">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ubicacion</label>
                    <input type="text" class="form-control" id="ce-location" placeholder="Lugar o direccion">
                </div>
                <div class="mb-3">
                    <label class="form-label">Enlace virtual (opcional)</label>
                    <input type="url" class="form-control" id="ce-link" placeholder="https://zoom.us/...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Imagen de portada (opcional)</label>
                    <input type="file" class="form-control" id="ce-cover" accept="image/*">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-gradient w-100" id="btn-create-event" onclick="createEvent()">
                    <i class="bi bi-calendar-plus me-1"></i>Crear Evento
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<style>
.event-card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    margin-bottom: 0.8rem;
    cursor: pointer;
    transition: box-shadow 0.2s, transform 0.2s;
    border: 1px solid var(--border-color);
}
.event-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
}
.event-card-cover {
    height: 120px;
    background: linear-gradient(135deg, var(--dark-bg), var(--dark-bg-light));
    position: relative;
    overflow: hidden;
}
.event-card-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.event-card-date-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(255,255,255,0.95);
    border-radius: 12px;
    padding: 0.3rem 0.6rem;
    text-align: center;
    min-width: 48px;
}
[data-theme="dark"] .event-card-date-badge {
    background: rgba(30,30,36,0.95);
    color: var(--text-primary);
}
.event-card-date-badge .date-month {
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--ig-pink);
    line-height: 1;
}
.event-card-date-badge .date-day {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.2;
}
.event-card-body {
    padding: 1rem 1.2rem;
}
.event-card-body h5 {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 0.3rem;
    color: var(--text-primary);
}
.event-card-body .event-card-meta {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    font-size: 0.82rem;
    color: var(--text-muted);
}
.event-card-body .event-card-meta i {
    width: 16px;
    color: var(--gold);
}
.event-card-body .event-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.5rem;
}
.event-virtual-badge {
    font-size: 0.7rem;
    font-weight: 700;
    background: #e8f4fd;
    color: #1a73e8;
    padding: 0.15rem 0.5rem;
    border-radius: 6px;
}
[data-theme="dark"] .event-virtual-badge {
    background: #1a2940;
    color: #64b5f6;
}

/* Event Detail */
.event-detail-card {
    background: var(--card-bg);
    border-radius: 20px;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
}
.event-close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    background: rgba(0,0,0,0.4) !important;
    border-radius: 50%;
    padding: 0.4rem;
    filter: invert(1);
}
.event-detail-cover {
    height: 180px;
    background: linear-gradient(135deg, var(--dark-bg), var(--dark-bg-light));
    overflow: hidden;
}
.event-detail-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.event-detail-body {
    padding: 1.2rem 1.5rem 1.5rem;
}
.event-detail-badges {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.5rem;
}
.event-detail-body h3 {
    font-weight: 800;
    font-size: 1.2rem;
    margin-bottom: 0.8rem;
    color: var(--text-primary);
}
.event-detail-meta {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 1rem;
}
.event-meta-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.88rem;
    color: var(--text-secondary);
}
.event-meta-item i {
    color: var(--gold);
    width: 18px;
}
.event-detail-desc {
    font-size: 0.9rem;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 1rem;
}
.event-detail-organizer {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 1rem;
}
.event-rsvp-section {
    border-top: 1px solid var(--border-color);
    padding-top: 1rem;
}
.event-attendee-count {
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 0.6rem;
}
.event-rsvp-buttons {
    display: flex;
    gap: 0.4rem;
}
.rsvp-btn {
    border: 1.5px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 0.8rem;
    border-radius: 8px;
    padding: 0.4rem 0.8rem;
    transition: all 0.2s;
}
.rsvp-btn:hover { border-color: var(--gold); color: var(--gold); }
.rsvp-btn.active {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
}
.event-attendees-list {
    margin-top: 1rem;
}
.event-attendees-list .gm-item {
    border-bottom: none;
    padding: 0.4rem 0;
}

/* Create Event Modal */
#createEventModal .form-label {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-secondary);
}
#createEventModal .form-control {
    border-radius: 10px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-primary);
}
#createEventModal .form-control:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(131,58,180,0.15);
}
</style>

<script>
const MONTHS_ES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
let currentEventTab = 'upcoming';
let activeEventId = null;

document.addEventListener('DOMContentLoaded', () => {
    if (!isLoggedIn()) { window.location.href = '/login/'; return; }
    loadEvents();
});

function switchEventTab(tab) {
    currentEventTab = tab;
    document.querySelectorAll('.hosting-tabs .hosting-tab').forEach((t, i) => {
        t.classList.toggle('active', i === (tab === 'upcoming' ? 0 : 1));
    });
    loadEvents();
}

async function loadEvents() {
    const spinner = document.getElementById('events-spinner');
    const list = document.getElementById('events-list');
    const empty = document.getElementById('events-empty');

    spinner.style.display = 'block';
    list.innerHTML = '';
    empty.style.display = 'none';

    const url = currentEventTab === 'my-events' ? '/api/events/mine/' : '/api/events/';

    try {
        const res = await authFetch(url);
        spinner.style.display = 'none';
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();
        const events = data.results || data;

        if (events.length === 0) {
            empty.style.display = 'block';
            return;
        }

        list.innerHTML = events.map(renderEventCard).join('');
    } catch(e) {
        spinner.style.display = 'none';
        showToast('Error al cargar eventos');
        console.error(e);
    }
}

function renderEventCard(ev) {
    const dt = new Date(ev.start_date || ev.date || ev.created_at);
    const month = MONTHS_ES[dt.getMonth()];
    const day = dt.getDate();
    const coverImg = ev.cover_image ? `<img src="${ev.cover_image}" alt="">` : '';
    const isVirtual = !!ev.meeting_link;
    const virtualBadge = isVirtual ? '<span class="event-virtual-badge"><i class="bi bi-camera-video me-1"></i>Virtual</span>' : '';
    const rsvpCount = ev.attendee_count || ev.rsvp_count || 0;

    return `
    <div class="event-card" onclick="openEventDetail(${ev.id})">
        <div class="event-card-cover">
            ${coverImg}
            <div class="event-card-date-badge">
                <div class="date-month">${month}</div>
                <div class="date-day">${day}</div>
            </div>
        </div>
        <div class="event-card-body">
            <h5>${escapeHtml(ev.title)}</h5>
            <div class="event-card-meta">
                <span><i class="bi bi-clock me-1"></i>${formatEventDate(ev)}</span>
                ${ev.location ? `<span><i class="bi bi-geo-alt me-1"></i>${escapeHtml(ev.location)}</span>` : ''}
            </div>
            <div class="event-card-footer">
                <span style="font-size:0.8rem; color:var(--text-muted);">
                    <i class="bi bi-people me-1"></i>${rsvpCount} asistentes
                </span>
                ${virtualBadge}
            </div>
        </div>
    </div>`;
}

function formatEventDate(ev) {
    const start = new Date(ev.start_date || ev.date || ev.created_at);
    const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    return start.toLocaleDateString('es', options);
}

async function openEventDetail(eventId) {
    activeEventId = eventId;
    const modal = document.getElementById('event-detail-modal');
    modal.style.display = 'flex';

    try {
        const res = await authFetch(`/api/events/${eventId}/`);
        if (!res.ok) throw new Error('Failed');
        const ev = await res.json();

        // Cover
        document.getElementById('ed-cover').innerHTML = ev.cover_image ? `<img src="${ev.cover_image}" alt="">` : '';

        // Badges
        const badges = document.getElementById('ed-badges');
        badges.innerHTML = '';
        if (ev.meeting_link) badges.innerHTML += '<span class="event-virtual-badge"><i class="bi bi-camera-video me-1"></i>Virtual</span>';

        // Title
        document.getElementById('ed-title').textContent = ev.title;

        // Date
        document.getElementById('ed-date').textContent = formatEventDate(ev);

        // Location
        const locWrap = document.getElementById('ed-location-wrap');
        if (ev.location) {
            locWrap.style.display = 'flex';
            document.getElementById('ed-location').textContent = ev.location;
        } else {
            locWrap.style.display = 'none';
        }

        // Virtual link
        const linkWrap = document.getElementById('ed-link-wrap');
        if (ev.meeting_link) {
            linkWrap.style.display = 'flex';
            document.getElementById('ed-link').href = ev.meeting_link;
        } else {
            linkWrap.style.display = 'none';
        }

        // Description
        document.getElementById('ed-description').textContent = ev.description || '';

        // Organizer
        const org = ev.organizer || ev.created_by || {};
        const orgName = org.display_name || org.first_name || org.username || '';
        document.getElementById('ed-organizer').innerHTML = orgName
            ? `<i class="bi bi-person me-1"></i>Organizado por <strong>${escapeHtml(orgName)}</strong>`
            : '';

        // RSVP status
        const rsvpCount = ev.attendee_count || ev.rsvp_count || 0;
        document.getElementById('ed-attendees-count').innerHTML = `<i class="bi bi-people me-1"></i>${rsvpCount} asistentes`;

        // Mark active RSVP
        document.querySelectorAll('.rsvp-btn').forEach(b => b.classList.remove('active'));
        if (ev.my_rsvp) {
            const activeBtn = document.querySelector(`.rsvp-btn[data-rsvp="${ev.my_rsvp}"]`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        // Load attendees
        loadAttendees(eventId);

    } catch(e) {
        showToast('Error al cargar evento');
        console.error(e);
    }
}

async function loadAttendees(eventId) {
    const list = document.getElementById('ed-attendees-list');
    try {
        const res = await authFetch(`/api/events/${eventId}/attendees/`);
        if (!res.ok) return;
        const data = await res.json();
        const attendees = data.results || data;
        if (attendees.length === 0) { list.innerHTML = ''; return; }

        list.innerHTML = attendees.slice(0, 10).map(a => {
            const u = a.user || a;
            const name = u.display_name || u.first_name || u.username || '';
            const initial = (name[0] || '?').toUpperCase();
            const avatarInner = u.avatar ? `<img src="${u.avatar}" alt="">` : initial;
            const statusLabel = a.status === 'going' ? 'Asistira' : a.status === 'maybe' ? 'Tal vez' : '';
            return `
            <div class="gm-item">
                <a href="/profile/${u.id}/" class="gm-avatar">${avatarInner}</a>
                <div class="gm-info">
                    <a href="/profile/${u.id}/" class="gm-name" style="text-decoration:none;">${escapeHtml(name)}</a>
                </div>
                <span class="meta-badge">${statusLabel}</span>
            </div>`;
        }).join('');
    } catch(e) {}
}

function closeEventDetail(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('event-detail-modal').style.display = 'none';
    activeEventId = null;
}

async function rsvpEvent(rsvpStatus) {
    if (!activeEventId) return;
    try {
        const res = await authFetch(`/api/events/${activeEventId}/rsvp/`, {
            method: 'POST',
            body: JSON.stringify({ status: rsvpStatus })
        });
        if (res.ok) {
            document.querySelectorAll('.rsvp-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.rsvp-btn[data-rsvp="${rsvpStatus}"]`).classList.add('active');
            showToast('RSVP actualizado');
        }
    } catch(e) {
        showToast('Error');
    }
}

function openCreateEventModal() {
    document.getElementById('ce-title').value = '';
    document.getElementById('ce-description').value = '';
    document.getElementById('ce-start').value = '';
    document.getElementById('ce-end').value = '';
    document.getElementById('ce-location').value = '';
    document.getElementById('ce-link').value = '';
    document.getElementById('ce-cover').value = '';
    new bootstrap.Modal(document.getElementById('createEventModal')).show();
}

async function createEvent() {
    const title = document.getElementById('ce-title').value.trim();
    if (!title) { showToast('El evento necesita un titulo'); return; }

    const btn = document.getElementById('btn-create-event');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Creando...';

    const formData = new FormData();
    formData.append('title', title);
    formData.append('description', document.getElementById('ce-description').value.trim());
    const start = document.getElementById('ce-start').value;
    const end = document.getElementById('ce-end').value;
    if (start) formData.append('start_date', start);
    if (end) formData.append('end_date', end);
    const loc = document.getElementById('ce-location').value.trim();
    if (loc) formData.append('location', loc);
    const link = document.getElementById('ce-link').value.trim();
    if (link) formData.append('meeting_link', link);
    const cover = document.getElementById('ce-cover').files[0];
    if (cover) formData.append('cover_image', cover);

    try {
        const res = await authFetch('/api/events/', {
            method: 'POST',
            body: formData,
        });
        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('createEventModal')).hide();
            showToast('Evento creado');
            loadEvents();
        } else {
            const data = await res.json();
            showToast(Object.values(data).flat().join(', ') || 'Error al crear');
        }
    } catch(e) {
        showToast('Error de conexion');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-calendar-plus me-1"></i>Crear Evento';
    }
}
</script>
{% endblock %}
