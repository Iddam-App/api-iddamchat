{% extends "base.html" %}
{% load static %}

{% block title %}Explorar — IddamChat{% endblock %}

{% block content %}
<div class="feed-container">
    <div class="feed-header">
        <h2><i class="bi bi-compass me-2"></i>Explorar</h2>
    </div>

    <!-- Search Bar -->
    <div class="explore-search-bar">
        <i class="bi bi-search"></i>
        <input type="text" id="explore-search" placeholder="Buscar usuarios, grupos, #hashtags..." autocomplete="off">
        <button class="explore-clear" id="search-clear" style="display:none;" onclick="clearSearch()">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <!-- Category Chips -->
    <div class="explore-chips" id="explore-chips">
        <button class="explore-chip active" data-cat="" onclick="filterCategory(this, '')">Todos</button>
        <button class="explore-chip" data-cat="testimony" onclick="filterCategory(this, 'testimony')">Testimonios</button>
        <button class="explore-chip" data-cat="devotional" onclick="filterCategory(this, 'devotional')">Devocionales</button>
        <button class="explore-chip" data-cat="hobby" onclick="filterCategory(this, 'hobby')">Hobby</button>
        <button class="explore-chip" data-cat="news" onclick="filterCategory(this, 'news')">Noticias</button>
    </div>

    <!-- User Suggestions -->
    <div id="suggestions-section" style="display:none;">
        <div class="search-section-label"><i class="bi bi-person-plus me-1"></i>Personas que quizás conozcas</div>
        <div class="suggestions-scroll" id="suggestions-list"></div>
    </div>

    <!-- Search Results -->
    <div id="search-results" style="display:none;">
        <div id="search-users"></div>
        <div id="search-groups"></div>
        <div id="search-hashtags"></div>
    </div>

    <!-- Discovery Grid -->
    <div id="discover-section">
        <div class="feed-spinner" id="discover-spinner">
            <div class="spinner-border" role="status"></div>
        </div>
        <div class="profile-grid" id="discover-grid"></div>
        <div class="empty-state" id="discover-empty" style="display:none;">
            <i class="bi bi-compass"></i>
            <h5>Nada por aquí todavía</h5>
            <p>Sé el primero en publicar algo</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<style>
.suggestions-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 8px 0 16px;
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.suggestions-scroll::-webkit-scrollbar { display: none; }

.suggestion-card {
    flex: 0 0 140px;
    background: var(--card-bg, #1e1e1e);
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--border-color, #2a2a2a);
    transition: transform 0.15s;
}
.suggestion-card:active { transform: scale(0.97); }

.suggestion-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-color, #2EA3F2);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    margin: 0 auto 8px;
    overflow: hidden;
}
.suggestion-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.suggestion-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.suggestion-meta {
    font-size: 11px;
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
}
.suggestion-btn {
    margin-top: 10px;
    padding: 5px 16px;
    border-radius: 20px;
    border: none;
    background: var(--accent-color, #2EA3F2);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}
.suggestion-btn.following {
    background: transparent;
    border: 1px solid var(--border-color, #444);
    color: var(--text-secondary, #aaa);
}

.search-user-mutual {
    font-size: 11px;
    color: var(--text-muted, #888);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>

<script>
let discoverPosts = [];
let currentCategory = '';
let searchTimeout = null;

function formatMutualFollows(names) {
    if (!names || names.length === 0) return '';
    if (names.length === 1) return 'Seguido por ' + escapeHtml(names[0]);
    return 'Seguido por ' + escapeHtml(names[0]) + ' y ' + escapeHtml(names[1]);
}

onPageReady(() => {
    if (!isLoggedIn()) { window.location.href = '/login/'; return; }

    // Check for hashtag param
    const params = new URLSearchParams(window.location.search);
    const hashtagParam = params.get('hashtag');
    if (hashtagParam) {
        document.getElementById('explore-search').value = '#' + hashtagParam;
        searchHashtag(hashtagParam);
    } else {
        loadSuggestions();
        loadDiscoverGrid();
    }

    // Live search
    document.getElementById('explore-search').addEventListener('input', (e) => {
        const q = e.target.value.trim();
        document.getElementById('search-clear').style.display = q ? 'flex' : 'none';
        clearTimeout(searchTimeout);
        if (q.length < 2) {
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('discover-section').style.display = 'block';
            document.getElementById('suggestions-section').style.display =
                document.getElementById('suggestions-list').children.length ? '' : 'none';
            document.getElementById('explore-chips').style.display = '';
            return;
        }
        searchTimeout = setTimeout(() => performSearch(q), 300);
    });
});

async function loadSuggestions() {
    try {
        const res = await authFetch('/api/auth/users/suggestions/');
        if (!res.ok) return;
        const users = await res.json();
        if (!users.length) return;

        const list = document.getElementById('suggestions-list');
        list.innerHTML = users.map(u => {
            const name = u.display_name || u.first_name || u.username;
            const initial = (name[0] || '?').toUpperCase();
            const avatar = u.avatar
                ? `<img src="${u.avatar}" alt="">`
                : initial;
            const mutualText = formatMutualFollows(u.mutual_follows || []);
            const metaText = mutualText || ('@' + escapeHtml(u.username) + (u.country ? ' · ' + u.country : ''));
            return `
            <a href="/profile/${u.id}/" class="suggestion-card">
                <div class="suggestion-avatar">${avatar}</div>
                <div class="suggestion-name">${escapeHtml(name)}</div>
                <div class="suggestion-meta">${metaText}</div>
                <button class="suggestion-btn" onclick="toggleSugFollow(event, this, ${u.id})">Seguir</button>
            </a>`;
        }).join('');
        document.getElementById('suggestions-section').style.display = '';
    } catch(e) {
        console.error(e);
    }
}

async function toggleSugFollow(e, btn, userId) {
    e.preventDefault();
    e.stopPropagation();
    try {
        const res = await authFetch(`/api/social/follow/${userId}/`, { method: 'POST' });
        if (!res.ok) return;
        const data = await res.json();
        if (data.status === 'following' || data.status === 'follow_request_sent') {
            btn.textContent = data.status === 'follow_request_sent' ? 'Solicitado' : 'Siguiendo';
            btn.classList.add('following');
        } else {
            btn.textContent = 'Seguir';
            btn.classList.remove('following');
        }
    } catch(e) { console.error(e); }
}

async function loadDiscoverGrid() {
    const spinner = document.getElementById('discover-spinner');
    const grid = document.getElementById('discover-grid');
    const empty = document.getElementById('discover-empty');

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);

    try {
        const res = await authFetch('/api/posts/discover/', { signal: controller.signal });
        if (!res.ok) throw new Error('Failed');

        const data = await res.json();
        discoverPosts = data.results || data;

        if (discoverPosts.length === 0) {
            empty.style.display = 'block';
            grid.innerHTML = '';
        } else {
            renderDiscoverGrid();
        }
    } catch(e) {
        empty.style.display = 'block';
        console.error(e);
    } finally {
        clearTimeout(timeout);
        spinner.style.display = 'none';
    }
}

function renderDiscoverGrid() {
    const grid = document.getElementById('discover-grid');
    const empty = document.getElementById('discover-empty');

    let posts = discoverPosts;
    if (currentCategory) {
        posts = posts.filter(p => p.post_type === currentCategory);
    }

    if (posts.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    grid.innerHTML = posts.map(post => {
        const thumb = (post.images && post.images.length > 0)
            ? `<img src="${post.images[0].image}" alt="" loading="lazy">`
            : `<div class="grid-thumb-text"><i class="bi bi-chat-square-text"></i></div>`;
        const multiIcon = (post.images && post.images.length > 1)
            ? '<i class="bi bi-layers grid-multi-icon"></i>' : '';
        return `
        <a href="/post/${post.id}/" class="grid-thumb">
            ${thumb}
            ${multiIcon}
            <div class="grid-thumb-overlay">
                <span><i class="bi bi-heart-fill"></i> ${post.reaction_count || 0}</span>
                <span><i class="bi bi-chat-fill"></i> ${post.comment_count || 0}</span>
            </div>
        </a>`;
    }).join('');
}

function filterCategory(btn, cat) {
    currentCategory = cat;
    document.querySelectorAll('.explore-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    renderDiscoverGrid();
}

async function performSearch(query) {
    document.getElementById('search-results').style.display = 'block';
    document.getElementById('discover-section').style.display = 'none';
    document.getElementById('suggestions-section').style.display = 'none';
    document.getElementById('explore-chips').style.display = 'none';

    // Check if searching hashtag
    if (query.startsWith('#') && query.length > 1) {
        searchHashtag(query.substring(1));
        return;
    }

    // Search users and groups in parallel
    const [usersHtml, groupsHtml] = await Promise.all([
        searchUsers(query),
        searchGroups(query)
    ]);

    document.getElementById('search-users').innerHTML = usersHtml;
    document.getElementById('search-groups').innerHTML = groupsHtml;
    document.getElementById('search-hashtags').innerHTML = '';
}

async function searchUsers(query) {
    try {
        const res = await authFetch(`/api/auth/users/search/?q=${encodeURIComponent(query)}`);
        if (!res.ok) return '';
        const data = await res.json();
        const users = data.results || data;
        if (users.length === 0) return '';

        return `
        <div class="search-section-label"><i class="bi bi-people me-1"></i>Usuarios</div>
        ${users.map(u => {
            const name = u.display_name || u.first_name || u.username;
            const initial = (name[0] || '?').toUpperCase();
            const avatarInner = u.avatar ? `<img src="${u.avatar}" alt="">` : initial;
            const mutualText = formatMutualFollows(u.mutual_follows || []);
            return `
            <a href="/profile/${u.id}/" class="search-user-item">
                <div class="search-user-avatar">${avatarInner}</div>
                <div class="search-user-info">
                    <div class="search-user-name">${escapeHtml(name)}</div>
                    <div class="search-user-username">@${escapeHtml(u.username)}</div>
                    ${mutualText ? `<div class="search-user-mutual">${mutualText}</div>` : ''}
                </div>
            </a>`;
        }).join('')}`;
    } catch(e) {
        return '';
    }
}

async function searchGroups(query) {
    try {
        const res = await authFetch(`/api/groups/?search=${encodeURIComponent(query)}`);
        if (!res.ok) return '';
        const data = await res.json();
        const groups = data.results || data;
        if (groups.length === 0) return '';

        return `
        <div class="search-section-label"><i class="bi bi-collection me-1"></i>Grupos</div>
        ${groups.map(g => {
            const initial = (g.name[0] || '?').toUpperCase();
            const avatarInner = g.avatar ? `<img src="${g.avatar}" alt="">` : initial;
            return `
            <a href="/groups/" class="search-user-item" onclick="localStorage.setItem('open_group','${g.id}')">
                <div class="search-user-avatar" style="border-radius:12px;">${avatarInner}</div>
                <div class="search-user-info">
                    <div class="search-user-name">${escapeHtml(g.name)}</div>
                    <div class="search-user-username">${g.member_count} miembros</div>
                </div>
                <span class="meta-badge">${g.is_member ? 'Miembro' : 'Unirse'}</span>
            </a>`;
        }).join('')}`;
    } catch(e) {
        return '';
    }
}

async function searchHashtag(tag) {
    document.getElementById('search-results').style.display = 'block';
    document.getElementById('discover-section').style.display = 'none';
    document.getElementById('suggestions-section').style.display = 'none';
    document.getElementById('explore-chips').style.display = 'none';
    document.getElementById('search-users').innerHTML = '';
    document.getElementById('search-groups').innerHTML = '';

    const container = document.getElementById('search-hashtags');
    container.innerHTML = '<div class="feed-spinner"><div class="spinner-border spinner-border-sm"></div></div>';

    try {
        const res = await authFetch(`/api/posts/hashtag/${encodeURIComponent(tag)}/`);
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();
        const posts = data.results || data;

        if (posts.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="bi bi-hash"></i><h5>Sin resultados para #' + escapeHtml(tag) + '</h5></div>';
            return;
        }

        container.innerHTML = `
        <div class="search-section-label"><i class="bi bi-hash me-1"></i>#${escapeHtml(tag)} — ${posts.length} publicaciones</div>
        <div class="profile-grid">
            ${posts.map(post => {
                const thumb = (post.images && post.images.length > 0)
                    ? `<img src="${post.images[0].image}" alt="" loading="lazy">`
                    : `<div class="grid-thumb-text"><i class="bi bi-chat-square-text"></i></div>`;
                return `
                <a href="/post/${post.id}/" class="grid-thumb">
                    ${thumb}
                    <div class="grid-thumb-overlay">
                        <span><i class="bi bi-heart-fill"></i> ${post.reaction_count || 0}</span>
                        <span><i class="bi bi-chat-fill"></i> ${post.comment_count || 0}</span>
                    </div>
                </a>`;
            }).join('')}
        </div>`;
    } catch(e) {
        container.innerHTML = '';
        console.error(e);
    }
}

function clearSearch() {
    document.getElementById('explore-search').value = '';
    document.getElementById('search-clear').style.display = 'none';
    document.getElementById('search-results').style.display = 'none';
    document.getElementById('discover-section').style.display = 'block';
    document.getElementById('explore-chips').style.display = '';
    document.getElementById('suggestions-section').style.display =
        document.getElementById('suggestions-list').children.length ? '' : 'none';
    // Clear URL params
    if (window.location.search) {
        history.replaceState(null, '', '/explore/');
    }
}
</script>
{% endblock %}
