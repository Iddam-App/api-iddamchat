<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8956d"/>
      <stop offset="35%" style="stop-color:#b07a50"/>
      <stop offset="65%" style="stop-color:#8B7355"/>
      <stop offset="100%" style="stop-color:#6d5a43"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle inner radial highlight -->
  <circle cx="256" cy="240" r="200" fill="rgba(255,255,255,0.04)"/>

  <!--
    Typographic logo matching the official COGWA branding:
    "IGLESIA de DIOS" with "UNA ASOCIACION MUNDIAL" below
  -->

  <!-- "IGLESIA" - large serif, all caps -->
  <text x="256" y="210" text-anchor="middle" fill="white" font-family="'Georgia', 'Times New Roman', 'Palatino', serif" font-size="68" font-weight="700" letter-spacing="6" opacity="0.95">IGLESIA</text>

  <!-- "de" - smaller italic serif -->
  <text x="256" y="262" text-anchor="middle" fill="white" font-family="'Georgia', 'Times New Roman', 'Palatino', serif" font-size="40" font-style="italic" font-weight="400" letter-spacing="2" opacity="0.75">de</text>

  <!-- "DIOS" - large serif, all caps -->
  <text x="256" y="330" text-anchor="middle" fill="white" font-family="'Georgia', 'Times New Roman', 'Palatino', serif" font-size="80" font-weight="700" letter-spacing="10" opacity="0.95">DIOS</text>

  <!-- Decorative thin line separator -->
  <line x1="130" y1="355" x2="382" y2="355" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- "UNA ASOCIACION MUNDIAL" - smaller, lighter, all caps -->
  <text x="256" y="390" text-anchor="middle" fill="white" font-family="'Georgia', 'Times New Roman', 'Palatino', serif" font-size="25" font-weight="400" letter-spacing="5" opacity="0.6">UNA ASOCIACION</text>
  <text x="256" y="425" text-anchor="middle" fill="white" font-family="'Georgia', 'Times New Roman', 'Palatino', serif" font-size="25" font-weight="400" letter-spacing="5" opacity="0.6">MUNDIAL</text>
</svg>
