<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8956d"/>
      <stop offset="35%" style="stop-color:#b07a50"/>
      <stop offset="65%" style="stop-color:#8B7355"/>
      <stop offset="100%" style="stop-color:#6d5a43"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Outer seal ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="white" stroke-width="3.5" opacity="0.85"/>
  <circle cx="256" cy="230" r="125" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>

  <!-- Open Bible at base of cross -->
  <path d="M220 275 C220 265 235 258 256 258 C277 258 292 265 292 275 L292 295 C292 288 277 282 256 282 C235 282 220 288 220 295z" fill="white" opacity="0.9"/>
  <line x1="256" y1="258" x2="256" y2="295" stroke="url(#bg)" stroke-width="1.5" opacity="0.5"/>
  <!-- Bible page lines left -->
  <line x1="230" y1="270" x2="250" y2="266" stroke="url(#bg)" stroke-width="0.8" opacity="0.3"/>
  <line x1="232" y1="278" x2="250" y2="274" stroke="url(#bg)" stroke-width="0.8" opacity="0.3"/>
  <!-- Bible page lines right -->
  <line x1="262" y1="266" x2="282" y2="270" stroke="url(#bg)" stroke-width="0.8" opacity="0.3"/>
  <line x1="262" y1="274" x2="280" y2="278" stroke="url(#bg)" stroke-width="0.8" opacity="0.3"/>

  <!-- Cross rising from Bible -->
  <rect x="245" y="145" width="22" height="115" rx="5" fill="white" opacity="0.95"/>
  <rect x="218" y="178" width="76" height="22" rx="5" fill="white" opacity="0.95"/>

  <!-- Light rays from cross top -->
  <line x1="256" y1="130" x2="256" y2="110" stroke="white" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="236" y1="138" x2="225" y2="122" stroke="white" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
  <line x1="276" y1="138" x2="287" y2="122" stroke="white" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
  <line x1="220" y1="155" x2="205" y2="145" stroke="white" stroke-width="1.2" opacity="0.25" stroke-linecap="round"/>
  <line x1="292" y1="155" x2="307" y2="145" stroke="white" stroke-width="1.2" opacity="0.25" stroke-linecap="round"/>

  <!-- Curved text: IGLESIA DE DIOS along top of seal -->
  <defs>
    <path id="topArc" d="M130 230 A126 126 0 0 1 382 230"/>
  </defs>
  <text fill="rgba(255,255,255,0.75)" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" letter-spacing="5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">IGLESIA DE DIOS</textPath>
  </text>

  <!-- Curved text: UNA ASOCIACION MUNDIAL along bottom of seal -->
  <defs>
    <path id="bottomArc" d="M145 255 A120 120 0 0 0 367 255"/>
  </defs>
  <text fill="rgba(255,255,255,0.55)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">UNA ASOCIACION MUNDIAL</textPath>
  </text>

  <!-- Small decorative dots on seal -->
  <circle cx="136" cy="230" r="3" fill="white" opacity="0.5"/>
  <circle cx="376" cy="230" r="3" fill="white" opacity="0.5"/>

  <!-- IDDAM text at bottom -->
  <text x="256" y="428" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="8">IDDAM</text>

  <!-- Subtle separator line above IDDAM -->
  <line x1="195" y1="393" x2="317" y2="393" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
</svg>
